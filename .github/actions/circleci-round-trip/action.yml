name: CircleCI round-trip

description: Trigger one CircleCI round-trip workflow, selected by format, and wait for its result.

inputs:
  project:
    description: CircleCI project slug, for example gh/ParamountDataManagement/import-pipeline-tests
    required: true
  branch:
    description: Branch whose CircleCI configuration should run
    required: true
  format:
    description: >-
      Round-trip format, for example excel, aces or pies. Sends the pipeline
      parameter run-<format>-round-trip and waits on the workflow
      <format>-round-trip; the CircleCI project config declares which exist.
    required: true
  triggered-by:
    description: Trigger provenance written to CircleCI pipeline parameters
    required: true
  upstream-sha:
    description: Optional upstream commit SHA written to CircleCI pipeline parameters
    required: false
    default: ""
  timeout-seconds:
    description: Maximum time to wait for the round-trip workflow
    required: false
    default: "900"
  poll-seconds:
    description: Delay between CircleCI workflow polls
    required: false
    default: "15"
  empty-grace-seconds:
    description: Time to wait for CircleCI to create its first workflow
    required: false
    default: "120"
  max-transient-failures:
    description: Consecutive CircleCI API failures tolerated while polling
    required: false
    default: "3"

outputs:
  job-number:
    description: >-
      CircleCI job number of the round-trip job, for the artifacts API
      (GET /project/{slug}/{job-number}/artifacts). Empty when the workflow
      never became visible, or when its job could not be identified
      unambiguously — a consumer must treat empty as "no results to fetch"
      rather than as a job number.
    value: ${{ steps.round-trip.outputs.job-number }}
  workflow-id:
    description: CircleCI workflow id that was waited on. Empty if none appeared.
    value: ${{ steps.round-trip.outputs.workflow-id }}
  pipeline-id:
    description: CircleCI pipeline id created by this action.
    value: ${{ steps.round-trip.outputs.pipeline-id }}
  exit-code:
    description: >-
      round_trip.sh's own exit code. The reusable workflow runs this action with
      continue-on-error so the outputs above survive a red round-trip, then
      re-raises this code — without it that re-raise would flatten every
      distinct failure (1 failed, 3 never ran, 4 timed out, 5 unverified) into
      a bare 1.
    value: ${{ steps.round-trip.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Trigger and await CircleCI round-trip
      id: round-trip
      shell: bash
      env:
        CIRCLECI_PROJECT: ${{ inputs.project }}
        CIRCLECI_BRANCH: ${{ inputs.branch }}
        CIRCLECI_ROUND_TRIP_FORMAT: ${{ inputs.format }}
        CIRCLECI_TRIGGERED_BY: ${{ inputs['triggered-by'] }}
        CIRCLECI_UPSTREAM_SHA: ${{ inputs['upstream-sha'] }}
        CIRCLECI_TIMEOUT_SECONDS: ${{ inputs['timeout-seconds'] }}
        CIRCLECI_POLL_SECONDS: ${{ inputs['poll-seconds'] }}
        CIRCLECI_EMPTY_GRACE_SECONDS: ${{ inputs['empty-grace-seconds'] }}
        CIRCLECI_MAX_TRANSIENT_FAILURES: ${{ inputs['max-transient-failures'] }}
      run: ${{ github.action_path }}/round_trip.sh
