name: CU-id title sync

# ORG-WIDE title sync (applied to ClickUp-consumer repos via an org ruleset).
# Copies the ClickUp CU-id from the branch name into the PR title using the
# built-in GITHUB_TOKEN, so squash-merge (with "Default to PR title") carries the
# id into the commit and the deploy-time updater resolves it with a local scan —
# no managed PAT anywhere.
#
# Single source of truth for parsing: the target repo's vendored canonical lib
# .claude-standards/ci/clickup/clickup-id.sh (pdm-claude-standards). No regex is
# defined in this workflow. Repos without the vendored lib are a clean no-op.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: cu-id-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-cu-id:
    name: Sync CU-id into PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to append the CU-id to the PR title via `gh pr edit`
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not let private-submodule auth failure fail the PR before our
          # non-blocking guard can run. We populate the standards submodule
          # best-effort below, then skip cleanly if the parser is unavailable.
          submodules: false
          persist-credentials: false

      - name: Populate canonical parser submodule if accessible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 .claude-standards
          status=$?
          git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true

          if [ "$status" -ne 0 ]; then
            echo "Could not populate .claude-standards with the built-in token — continuing so the sync step can skip non-blockingly."
          fi
          exit 0

      - name: Ensure the PR title carries the branch's CU-<id>(s)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # Fork PRs get a read-only token — cannot (and must not) edit.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Fork PR ($HEAD_REPO) — read-only token, skipping (non-blocking)."
            exit 0
          fi

          LIB=".claude-standards/ci/clickup/clickup-id.sh"
          if [ ! -f "$LIB" ]; then
            echo "Canonical parser not available in this checkout ($LIB) — skipping (non-blocking)."
            exit 0
          fi
          # shellcheck source=/dev/null
          . "$LIB"

          ids="$(printf '%s' "$BRANCH" | clickup_extract_ids || true)"
          if [ -z "$ids" ]; then
            echo "No CU-id in branch '$BRANCH' — nothing to sync (non-blocking)."
            exit 0
          fi

          suffix=""
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if printf '%s' "$TITLE" | grep -qiF "$id"; then continue; fi
            suffix="$suffix ($id)"
          done <<EOF
          $ids
          EOF

          if [ -z "$suffix" ]; then
            echo "PR title already carries the branch CU-id(s) — no change."
            exit 0
          fi

          new_title="${TITLE}${suffix}"
          echo "before: $TITLE"
          echo "after:  $new_title"
          gh pr edit "$PR" --repo "$REPO" --title "$new_title"
