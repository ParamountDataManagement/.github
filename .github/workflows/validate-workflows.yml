name: Validate Workflows

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # id-token: write is the OIDC exchange behind the KMS-signed pdm-ci-reader
    # token below; contents: read is all the rest of the job uses.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The hosted runner image may carry a stale Chrome apt index; remove it
      # before installing shellcheck so an unrelated package mirror failure does
      # not prevent workflow validation.
      - name: Install shellcheck
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run actionlint
        run: |
          actionlint -shellcheck="$(command -v shellcheck)"

      - name: Validate CircleCI round-trip action
        run: |
          shellcheck .github/actions/circleci-round-trip/round_trip.sh tests/circleci-round-trip.sh
          ./tests/circleci-round-trip.sh

      # Under pipefail `writer | grep -q` reads a match that succeeded as absent;
      # the shared pdm-ci-tools lint fails on any such pipe (CU-86bc9nnzd).
      #
      # This repo is public and pdm-ci-tools is private, and GitHub will not
      # resolve a private repo's action from a public one: `uses:
      # ParamountDataManagement/pdm-ci-tools/actions/grep-q-pipe@v1` fails at
      # "Set up job" with "Unable to resolve action". So a read-only token is
      # minted for pdm-ci-tools, that checkout brings in the v1 action, and it
      # runs from its local path.
      #
      # The token is the pdm-ci-reader App's (contents: read is its whole
      # ceiling), signed in AWS KMS with NO stored key: the job assumes
      # /ci-cd/pdm-ci-reader-signer through GitHub OIDC (it trusts every
      # ParamountDataManagement repo), signs the App JWT with kms:Sign on
      # alias/pdm-ci-reader-app, and exchanges it for an installation token.
      # These are the steps of pdm-ci-tools' actions/mint-ci-reader-token,
      # inlined because that action is private and this repo is public. The
      # fleet App's stored key this used before was revoked on 2026-11-23.
      # Fork PRs get no OIDC token, so on one this step fails rather than
      # passing unchecked.
      #
      # The checkout is pinned to the commit v1 pointed at when this was
      # reviewed, not the moving tag, so a retargeted v1 cannot turn this
      # blocking gate into a no-op. Bump the SHA in a reviewed PR.
      - name: Assume pdm-ci-reader-signer
        id: reader-aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::373963237795:role/ci-cd/pdm-ci-reader-signer
          aws-region: us-east-2
          output-credentials: true
          output-env-credentials: false

      - name: Mint a read-only pdm-ci-tools token (KMS-signed pdm-ci-reader)
        id: pdm-ci-tools-token
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.reader-aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.reader-aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.reader-aws.outputs.aws-session-token }}
          AWS_REGION: us-east-2
          APP_ID: "5322477"
          INSTALLATION_ID: "171524280"
          KMS_KEY: alias/pdm-ci-reader-app
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)"
          signing_input="${header}.${payload}"
          signature="$(aws kms sign --key-id "$KMS_KEY" --message-type RAW \
            --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 \
            --message "$(printf '%s' "$signing_input" | openssl base64 -A)" \
            --query Signature --output text | openssl base64 -d -A | b64url)"
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${signing_input}.${signature}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")"
          token="$(jq -r '.token // empty' <<<"$response")"
          contents="$(jq -r '.permissions.contents // empty' <<<"$response")"
          if [ -z "$token" ] || [ "$contents" != read ]; then
            echo "::error title=pdm-ci-reader mint::installation token missing or not contents:read" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Check out pdm-ci-tools at v1 (d3f0f61)
        uses: actions/checkout@v4
        with:
          repository: ParamountDataManagement/pdm-ci-tools
          ref: d3f0f6182d99adfc9740d6ba7e0b956a575c5598
          token: ${{ steps.pdm-ci-tools-token.outputs.token }}
          path: .pdm-ci-tools
          persist-credentials: false

      - name: No pipe into an early-exiting grep under pipefail
        uses: ./.pdm-ci-tools/actions/grep-q-pipe

      # The org default PR template is read by pdm-ci-tools' regression-evidence
      # check and quoted by REGRESSION_TESTING_POLICY.md; pin the lines they share.
      - name: Validate the pull request template
        run: |
          shellcheck tests/pull-request-template.sh
          ./tests/pull-request-template.sh

      # CODEOWNERS is what gives the org promotion rulesets' code-owner review
      # its meaning; GitHub ignores a broken one silently, so pin its one rule.
      - name: Validate CODEOWNERS
        run: |
          shellcheck tests/codeowners.sh
          ./tests/codeowners.sh
