name: Validate Workflows

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The hosted runner image may carry a stale Chrome apt index; remove it
      # before installing shellcheck so an unrelated package mirror failure does
      # not prevent workflow validation.
      - name: Install shellcheck
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run actionlint
        run: |
          actionlint -shellcheck="$(command -v shellcheck)"

      - name: Validate CircleCI round-trip action
        run: |
          shellcheck .github/actions/circleci-round-trip/round_trip.sh tests/circleci-round-trip.sh
          ./tests/circleci-round-trip.sh

      # Under pipefail `writer | grep -q` reads a match that succeeded as absent;
      # the shared pdm-ci-tools lint fails on any such pipe (CU-86bc9nnzd).
      #
      # This repo is public and pdm-ci-tools is private, and GitHub will not
      # resolve a private repo's action from a public one: `uses:
      # ParamountDataManagement/pdm-ci-tools/actions/grep-q-pipe@v1` fails at
      # "Set up job" with "Unable to resolve action". So the fleet App mints a
      # token scoped to pdm-ci-tools (contents: read only), that checkout brings
      # in the same v1 action, and it runs from its local path. Fork PRs receive
      # no secrets, so on one this step fails rather than passing unchecked.
      - name: Mint a read-only pdm-ci-tools token
        id: pdm-ci-tools-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PDM_FLEET_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PDM_FLEET_AUTOMATION_PRIVATE_KEY }}
          owner: ParamountDataManagement
          repositories: pdm-ci-tools
          permission-contents: read

      - name: Check out pdm-ci-tools at v1
        uses: actions/checkout@v4
        with:
          repository: ParamountDataManagement/pdm-ci-tools
          ref: v1
          token: ${{ steps.pdm-ci-tools-token.outputs.token }}
          path: .pdm-ci-tools
          persist-credentials: false

      - name: No pipe into an early-exiting grep under pipefail
        uses: ./.pdm-ci-tools/actions/grep-q-pipe

      # The org default PR template is read by pdm-ci-tools' regression-evidence
      # check and quoted by REGRESSION_TESTING_POLICY.md; pin the lines they share.
      - name: Validate the pull request template
        run: |
          shellcheck tests/pull-request-template.sh
          ./tests/pull-request-template.sh

      # CODEOWNERS is what gives the org promotion rulesets' code-owner review
      # its meaning; GitHub ignores a broken one silently, so pin its one rule.
      - name: Validate CODEOWNERS
        run: |
          shellcheck tests/codeowners.sh
          ./tests/codeowners.sh
